<header>
  <app-busca (searchResults)="handleSearchResults($event)"></app-busca>
</header>
<app-page>
  <section>
    <div class="container">
      <app-card [pokemonList]="pokemonList"></app-card>
    </div>
  </section>
</app-page>

<app-footer >
  <app-paginate-control
    [count]="pokemonList.count"
    [currentPage]="currentPage"
    [limit]="limit"
    [next]="pokemonList.next?true:false"
    [previous]="pokemonList.previous?true:false"
    (nextPageEmitter)="nextPage()"
    (previousPageEmitter)="previousPage()"
    >
  </app-paginate-control>
</app-footer>
